<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miraç Göşker — Mimar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:#111;display:flex;align-items:center;justify-content:center;font-family:"Montserrat",sans-serif;padding:2rem;}
.card{
  width:680px;
  background:#000;
  display:grid;
  grid-template-columns:1fr 1fr;
  border:1px solid #1e1e1e;
  animation:fadeIn 0.8s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.left{
  padding:36px 32px;
  border-right:1px solid #1e1e1e;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.right{
  padding:36px 32px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* Sol üst: isim blok */
.name-block{
  border-left:3px solid #fff;
  padding-left:16px;
}
.name{font-size:20px;font-weight:600;color:#fff;letter-spacing:0.01em;margin-bottom:5px;}
.role-text{font-size:13px;font-weight:300;color:#aaa;letter-spacing:0.04em;}

/* Sol alt: iletişim */
.contacts{display:flex;flex-direction:column;gap:14px;}
.contact-row{display:flex;align-items:center;gap:13px;}
.contact-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.contact-text{font-size:12px;color:#ccc;font-weight:300;letter-spacing:0.02em;}

/* Sağ üst: logo */
.logo-wrap img{width:100%;height:auto;display:block;}

/* Sağ alt: servisler */
.right-bottom{display:flex;flex-direction:column;gap:0;}
.divider-line{height:2px;background:#fff;margin-bottom:20px;}
.services{display:flex;flex-direction:column;gap:12px;}
.service-item{font-size:12px;color:#ccc;font-weight:300;letter-spacing:0.03em;}
</style>
</head>
